version: '3.7'

services:
  certbot:
    image: davidsiaw/localdevbot
    container_name: certbot-cloudflare
    restart: unless-stopped
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      DOMAIN: ${DOMAIN}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL}
      CERTBOT_AGREE: 'true'
      OP_SERVICE_ACCOUNT_TOKEN: ${OP_SERVICE_ACCOUNT_TOKEN}
      OP_VAULT: ${OP_VAULT}
      OP_ITEM_NAME: ${OP_ITEM_NAME}
      OP_ACCOUNT: ${OP_ACCOUNT}
      LE_STAGING: ${LE_STAGING}
    volumes:
      - certbot-data:/etc/letsencrypt
      - certbot-work:/tmp/certbot-work
      - certbot-logs:/tmp/certbot-logs
    command: >
      bash -c '
        while true; do
          echo "=== $(date) ==="
          ruby lib/certbot_cloudflare.rb renew
          echo "Next check in 1 hour..."
          sleep 3600
        done
      '

volumes:
  certbot-data:
    external: true
  certbot-work:
    external: true
  certbot-logs:
    external: true
